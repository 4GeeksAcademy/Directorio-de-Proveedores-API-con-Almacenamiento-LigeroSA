[project]
name = "healthcore-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "tinydb>=4.8,<5",
  "starlette>=0.47.2,<2",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "python-jose[cryptography]>=3.5.0",
  "libpass[bcrypt]>=1.9,<2",
]

[project.scripts]
seed = "services.api.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "packages.incidents*"]
namespaces = true
